<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kantina{% endblock %}</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body class="{% block body_class %}{% endblock %}">
    <header>
        <h1><a href="{{ url_for('index') }}">Kantina</a></h1>
        <nav>
            <a class="knapp" href="{{ url_for('meny') }}">Se menyen</a>
            <a href="{{ url_for('kontakt') }}">Kontakt oss</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Kantina</p>
    </footer>

    {% block ekstra %}{% endblock %}
</body>
</html>
